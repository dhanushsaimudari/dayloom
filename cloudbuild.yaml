steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dayloom-app:$COMMIT_SHA', '.']

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dayloom-app:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with Secret Manager secret injection
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dayloom-app'
      - '--image=gcr.io/$PROJECT_ID/dayloom-app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=dayloom-personal-journal'
      - '--update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/dayloom-app:$COMMIT_SHA'
